<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 70" width="1000" height="70" role="img" aria-label="built for speed. shipped without re-encoding.">
<defs>
  <linearGradient id="f_line" x1="0" x2="1">
    <stop offset="0" stop-color="#e5384f" stop-opacity="0"/>
    <stop offset=".5" stop-color="#e5384f"/>
    <stop offset="1" stop-color="#e5384f" stop-opacity="0"/>
  </linearGradient>
</defs>
<style>

  .sans { font-family: 'Inter','Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif; }
  .mono { font-family: 'JetBrains Mono','Cascadia Code','SF Mono',Consolas,'Liberation Mono',monospace; }
  @media (prefers-reduced-motion: reduce) {
    * {
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
    }
  }

  .dot {
    animation: blink_f 1.1s steps(1) infinite;
  }
  @keyframes blink_f {
    50% { opacity: 0; }
  }
</style>
<rect width="1000" height="70" rx="8" fill="#0a0a0f"/>
<rect x="24" y="18" width="952" height="2" fill="url(#f_line)"/>
<text x="500" y="52" class="mono" font-size="14" fill="#8b8a9c" text-anchor="middle">built for speed. shipped without re-encoding.<tspan class="dot" fill="#ff5a70"> _</tspan></text>
</svg>
