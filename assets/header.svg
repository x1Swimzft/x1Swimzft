<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Dataria — Software Developer, Desktop Tools &amp; Media Processing">
<defs>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
  </pattern>
  <radialGradient id="glow" cx="82%" cy="50%" r="55%">
    <stop offset="0" stop-color="#e5384f" stop-opacity=".38"/>
    <stop offset="1" stop-color="#e5384f" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="bar" x1="0" x2="1">
    <stop offset="0" stop-color="#ff5a70"/>
    <stop offset="1" stop-color="#8f1d33"/>
  </linearGradient>
  <clipPath id="type">
    <rect x="64" y="60" width="236" height="34">
      <animate attributeName="width" dur="1.4s" begin="0.3s" fill="freeze" calcMode="discrete" values="0;12;23;35;46;58;70;81;93;104;116;128;139;151;162;174;186;197;209;220;236"/>
    </rect>
  </clipPath>
  <clipPath id="round">
    <rect width="1200" height="320" rx="18"/>
  </clipPath>
</defs>
<style>

  .sans { font-family: 'Inter','Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif; }
  .mono { font-family: 'JetBrains Mono','Cascadia Code','SF Mono',Consolas,'Liberation Mono',monospace; }
  @media (prefers-reduced-motion: reduce) {
    * {
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
    }
  }

  .cursor {
    animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .pulse {
    animation: pulse 2.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { stroke-opacity: .55; }
    50% { stroke-opacity: 1; }
  }
  .float {
    animation: float 5s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  .rise {
    animation: rise .8s ease-out .2s both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
<g clip-path="url(#round)">
  <rect width="1200" height="320" fill="#0a0a0f"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>
  <rect x=".5" y=".5" width="1199" height="319" rx="18" fill="none" stroke="#242432"/>

  <!-- left: identity -->
  <g clip-path="url(#type)">
    <text x="64" y="84" class="mono" font-size="19" fill="#ff5a70">$ whoami <tspan fill="#8b8a9c">~/x1Swimzft</tspan></text>
  </g>
  <rect class="cursor" x="304" y="68" width="10" height="20" fill="#ff5a70">
    <animate attributeName="x" dur="1.4s" begin="0.3s" fill="freeze" calcMode="discrete" values="64;76;87;99;110;122;134;145;157;168;180;192;203;215;226;238;250;261;273;284;304"/>
  </rect>

  <g class="rise">
    <text x="60" y="180" class="sans" font-size="92" font-weight="800" fill="#ecebf2" letter-spacing="-2">Dataria</text>
    <rect x="64" y="200" width="88" height="5" rx="2.5" fill="url(#bar)"/>
    <text x="64" y="244" class="sans" font-size="25" font-weight="500" fill="#c9c8d6">Software Developer — Desktop Tools &amp; Media Processing</text>
    <text x="64" y="278" class="mono" font-size="15" fill="#8b8a9c">performance  ·  lossless workflows  ·  clean native UI</text>
  </g>

  <!-- right: ISO-BMFF box stack (nested group avoids transform animation collisions) -->
  <g transform="translate(790 46)">
    <g class="float">
      <rect x="0" y="0" width="340" height="46" rx="10" fill="#111118" stroke="#242432"/>
      <text x="18" y="29" class="mono" font-size="16" fill="#c9c8d6">ftyp</text>
      <text x="322" y="29" class="mono" font-size="12" fill="#8b8a9c" text-anchor="end">0x0000</text>

      <rect class="pulse" x="0" y="60" width="340" height="86" rx="10" fill="#111118" stroke="#e5384f" stroke-width="2"/>
      <rect x="1" y="61" width="338" height="84" rx="9" fill="#e5384f" fill-opacity=".10"/>
      <text x="18" y="90" class="mono" font-size="16" fill="#ff8095" font-weight="700">moov</text>
      <text x="322" y="90" class="mono" font-size="12" fill="#8b8a9c" text-anchor="end">rewritten in place</text>
      <g fill="#e5384f">
        <rect x="18" y="108" width="92" height="8" rx="4" opacity=".95"/>
        <rect x="118" y="108" width="52" height="8" rx="4" opacity=".6"/>
        <rect x="178" y="108" width="120" height="8" rx="4" opacity=".35"/>
        <rect x="18" y="124" width="64" height="8" rx="4" opacity=".5"/>
      </g>

      <rect x="0" y="160" width="340" height="86" rx="10" fill="#111118" stroke="#242432"/>
      <text x="18" y="190" class="mono" font-size="16" fill="#c9c8d6">mdat</text>
      <text x="322" y="190" class="mono" font-size="12" fill="#8b8a9c" text-anchor="end">bit-exact · untouched</text>
      <g fill="#4a4a5e" opacity=".9">
        <rect x="18" y="208" width="304" height="6" rx="3"/>
        <rect x="18" y="222" width="236" height="6" rx="3"/>
      </g>
    </g>
  </g>
</g>
</svg>
